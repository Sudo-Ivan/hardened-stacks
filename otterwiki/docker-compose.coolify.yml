name: otterwiki

services:
  otterwiki:
    image: ${OTTERWIKI_IMAGE:-ghcr.io/sudo-ivan/hardened-stacks/otterwiki:latest}
    restart: unless-stopped
    user: "10001:10001"
    expose:
      - "8080"
    environment:
      - SERVICE_URL_OTTERWIKI_8080
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-32m}
      - TZ=${TZ:-UTC}
    volumes:
      - otterwiki_data:/app-data
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /var/lib/nginx:size=64m,uid=10001,gid=10001,mode=0755
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-A", "docker-healthcheck", "-fsS", "http://127.0.0.1:8080/-/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  otterwiki_data:
