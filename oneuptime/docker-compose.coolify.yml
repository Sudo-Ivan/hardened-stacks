name: oneuptime

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  valkey:
    image: valkey/valkey:9.1-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    restart: unless-stopped
    command: valkey-server --requirepass "${SERVICE_PASSWORD_ONEUPTIMEVALKEY:?}" --save "" --appendonly no
    environment:
      VALKEY_PASSWORD: ${SERVICE_PASSWORD_ONEUPTIMEVALKEY:?}
    networks:
      oneuptime:
        aliases:
          - redis
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${SERVICE_PASSWORD_ONEUPTIMEVALKEY}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:26.7@sha256:c1b7782ed3375560d70e571f3c2e87081246ae5aefb19886126001ec93660804
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${SERVICE_PASSWORD_ONEUPTIMECLICKHOUSE:?}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-oneuptime}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/config.d/system-log-ttl.xml:/etc/clickhouse-server/config.d/system-log-ttl.xml:ro
      - ./clickhouse/users.d/distributed-insert-tuning.xml:/etc/clickhouse-server/users.d/distributed-insert-tuning.xml:ro
    networks:
      - oneuptime
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  postgres:
    image: postgres:15-bookworm@sha256:5d1d70e254e3c5d7d76847a9deebb18478cd518df37abf6b278d4bdb1fe5d96c
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_ONEUPTIMEDB:?}
      POSTGRES_DB: ${DATABASE_NAME:-oneuptimedb}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m
    networks:
      - oneuptime
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oneuptimedb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  app:
    image: oneuptime/app:release@sha256:b6145bace5a9ce9831a8a29b3cbfe1d295a37984c4a1ce6384c6c3fde484082f
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &app-env
      SERVICE_URL_INGRESS_7849: ${SERVICE_URL_INGRESS_7849:-}
      HOST: ${HOST:?}
      HTTP_PROTOCOL: ${HTTP_PROTOCOL:-https}
      PROVISION_SSL: "false"
      ONEUPTIME_HTTP_PORT: "80"
      STATUS_PAGE_HTTPS_PORT: "443"
      STATUS_PAGE_CNAME_RECORD: ${STATUS_PAGE_CNAME_RECORD:-}
      DASHBOARD_CNAME_RECORD: ${DASHBOARD_CNAME_RECORD:-}
      ENVIRONMENT: production
      IS_ENTERPRISE_EDITION: "false"
      BILLING_ENABLED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      PORT: "3002"
      APP_PORT: "3002"
      HOME_PORT: "3002"
      SERVER_APP_HOSTNAME: app
      SERVER_HOME_HOSTNAME: app
      ONEUPTIME_SECRET: ${SERVICE_PASSWORD_ONEUPTIMESECRET:?}
      ENCRYPTION_SECRET: ${SERVICE_PASSWORD_ONEUPTIMEENCRYPTION:?}
      REGISTER_PROBE_KEY: ${SERVICE_PASSWORD_ONEUPTIMEPROBE:?}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${SERVICE_PASSWORD_ONEUPTIMEDB:?}
      DATABASE_NAME: oneuptimedb
      DATABASE_SSL_REJECT_UNAUTHORIZED: "false"
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_DB: 0
      VALKEY_USERNAME: default
      VALKEY_PASSWORD: ${SERVICE_PASSWORD_ONEUPTIMEVALKEY:?}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${SERVICE_PASSWORD_ONEUPTIMEVALKEY:?}
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${SERVICE_PASSWORD_ONEUPTIMECLICKHOUSE:?}
      CLICKHOUSE_DATABASE: oneuptime
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_MAX_OPEN_CONNECTIONS: "100"
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2}
      DISABLE_TELEMETRY: "true"
      DISABLE_TELEMETRY_FOR_APP: "true"
      DISABLE_TELEMETRY_FOR_PROBE: "true"
      DISABLE_TELEMETRY_FOR_INGRESS: "true"
      DISABLE_TELEMETRY_FOR_RUNNER: "true"
      DISABLE_UPDATE_CHECK: "false"
      DISABLE_AUTOMATIC_INCIDENT_CREATION: "false"
      DISABLE_AUTOMATIC_ALERT_CREATION: "false"
      DISABLE_TELEMETRY_INGESTION: "false"
      CAPTCHA_ENABLED: "false"
      GOOGLE_TAG_MANAGER_ENABLED: "false"
      ALLOW_PRIVATE_NETWORK_WEBHOOKS: "false"
      MQTT_INGEST_ENABLED: "false"
      GLOBAL_PROBE_1_KEY: ${SERVICE_PASSWORD_ONEUPTIMEPROBEKEY:?}
      SUBSCRIPTION_PLAN_BASIC: Basic,priceMonthlyId,priceYearlyId,0,0,1,0
      SUBSCRIPTION_PLAN_GROWTH: Growth,priceMonthlyId,priceYearlyId,0,0,2,14
      SUBSCRIPTION_PLAN_SCALE: Scale,priceMonthlyId,priceYearlyId,0,0,3,0
      SUBSCRIPTION_PLAN_ENTERPRISE: Enterprise,priceMonthlyId,priceYearlyId,-1,-1,4,14
    networks:
      - oneuptime
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    logging: *default-logging

  probe-1:
    image: oneuptime/probe:release@sha256:6b1b8f593dabe7be199298a55bcb77d82f9ea1c185cf480c6f12342ff54ffc58
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      ingress:
        condition: service_started
    shm_size: 512m
    environment:
      ONEUPTIME_URL: http://ingress:7849
      REGISTER_PROBE_KEY: ${SERVICE_PASSWORD_ONEUPTIMEPROBE:?}
      PROBE_NAME: Probe-1
      PROBE_DESCRIPTION: Global probe
      PROBE_MONITORING_WORKERS: "5"
      PROBE_KEY: ${SERVICE_PASSWORD_ONEUPTIMEPROBEKEY:?}
      PROBE_SYNTHETIC_MONITOR_SCRIPT_TIMEOUT_IN_MS: "60000"
      PROBE_SYNTHETIC_MONITOR_MAX_CONCURRENCY: "2"
      PROBE_SYNTHETIC_MONITOR_CHROMIUM_SANDBOX_ENABLED: "false"
      PROBE_CUSTOM_CODE_MONITOR_SCRIPT_TIMEOUT_IN_MS: "60000"
      PROBE_ALLOW_PRIVATE_NETWORK_MONITORS: "false"
      PROBE_MONITOR_FETCH_LIMIT: "10"
      PORT: "3874"
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DISABLE_TELEMETRY: "true"
    networks:
      - oneuptime
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - NET_RAW
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  ingress:
    image: oneuptime/nginx:release@sha256:468ac372d2f1e12f972a20130fda7d3523eb7f301a14a0305536bb1e34ca22cd
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      <<: *app-env
      ONEUPTIME_HTTP_PORT: "80"
      NGINX_LISTEN_ADDRESS: ""
      NGINX_LISTEN_OPTIONS: ""
      NGINX_INGEST_ACCESS_LOG: "on"
      DISABLE_TELEMETRY: "true"
    expose:
      - "7849"
    networks:
      - oneuptime
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: "1"
      net.ipv4.tcp_fin_timeout: "15"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7849/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *default-logging

volumes:
  postgres_data:
  clickhouse_data:

networks:
  oneuptime:
    driver: bridge
