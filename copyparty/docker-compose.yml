services:
  copyparty:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COPYPARTY_COMMIT: ${COPYPARTY_COMMIT:-ac4be555f6cceacbbbc6d50e681a64612da90711}
        COPYPARTY_UID: "10001"
        COPYPARTY_GID: "10001"
    image: ghcr.io/sudo-ivan/hardened-stacks/copyparty:local
    restart: unless-stopped
    user: "10001:10001"
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:3923:3923"
    environment:
      - COPYPARTY_ADMIN_USER=${COPYPARTY_ADMIN_USER:-admin}
      - COPYPARTY_ADMIN_PASSWORD=${COPYPARTY_ADMIN_PASSWORD:?}
      - COPYPARTY_SITE_NAME=${COPYPARTY_SITE_NAME:-HardenedStacks Files}
      - COPYPARTY_XFF_SRC=${COPYPARTY_XFF_SRC:-lan}
      - TZ=${TZ:-UTC}
    volumes:
      - copyparty_cfg:/cfg
      - copyparty_data:/w
      - copyparty_state:/state
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3923/?reset=/._ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  copyparty_cfg:
  copyparty_data:
  copyparty_state:
