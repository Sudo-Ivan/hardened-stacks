name: privatebin

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  privatebin:
    image: privatebin/nginx-fpm-alpine:2.0.6@sha256:13290e2f04bfd98cf8fc7e8d216fb76b2b2d12373d4923b859cd41c2d984fde8
    restart: unless-stopped
    user: "65534:82"
    environment:
      - SERVICE_FQDN_PRIVATEBIN_8080
      - TZ=${TZ:-UTC}
      - PHP_TZ=${TZ:-UTC}
    expose:
      - "8080"
    volumes:
      - privatebin_data:/srv/data
      - type: bind
        source: ./config/conf.php
        target: /srv/cfg/conf.php
        content: |
          ;<?php http_response_code(403); /*
          ; Hardened PrivateBin defaults for public paste hosting.
          ; Server stores ciphertext only (AES-256-GCM in the browser).

          [main]
          name = "Paste"
          basepath = "${PRIVATEBIN_PUBLIC_URL:?}/"
          discussion = false
          opendiscussion = false
          password = true
          fileupload = false
          burnafterreadingselected = true
          defaultformatter = "plaintext"
          sizelimit = 2097152
          templateselection = false
          languageselection = false
          httpwarning = true
          compression = "zlib"
          notice = "Pastes are encrypted in your browser. The server cannot read them. Do not share the full URL if the paste is sensitive unless you also set a password."

          [expire]
          default = "1day"

          [expire_options]
          5min = 300
          10min = 600
          1hour = 3600
          1day = 86400
          1week = 604800
          1month = 2592000

          [formatter_options]
          plaintext = "Plain Text"
          syntaxhighlighting = "Source Code"
          markdown = "Markdown"

          [traffic]
          limit = 10
          header = "X_FORWARDED_FOR"

          [purge]
          limit = 300
          batchsize = 10

          [model]
          class = Filesystem
          [model_options]
          dir = PATH "data"
    tmpfs:
      - /tmp:size=64m,mode=1777,nodev,noexec
      - /run:size=16m,mode=1777,nodev,exec
      - /var/lib/nginx/tmp:size=64m,mode=1777,nodev,noexec
    networks:
      - privatebin
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:8080/",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    logging: *default-logging

volumes:
  privatebin_data:

networks:
  privatebin:
    driver: bridge
