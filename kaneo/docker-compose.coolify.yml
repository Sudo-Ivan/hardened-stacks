name: kaneo

services:
  kaneo:
    image: ${KANEO_IMAGE:-ghcr.io/sudo-ivan/hardened-stacks/kaneo:latest}
    restart: unless-stopped
    user: "1001:1001"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5173"
    environment:
      - SERVICE_URL_KANEO_5173
      - SERVICE_PASSWORD_KANEOAUTH
      - SERVICE_PASSWORD_KANEODB
      - KANEO_CLIENT_URL
      - AUTH_SECRET=${SERVICE_PASSWORD_KANEOAUTH:?}
      - POSTGRES_DB=kaneo
      - POSTGRES_USER=kaneo
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_KANEODB:?}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://kaneo:${SERVICE_PASSWORD_KANEODB:?}@postgres:5432/kaneo
      - TZ=${TZ:-UTC}
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=16m,mode=1777
      - /run:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  postgres:
    image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    restart: unless-stopped
    environment:
      - POSTGRES_USER=kaneo
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_KANEODB:?}
      - POSTGRES_DB=kaneo
      - TZ=${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
