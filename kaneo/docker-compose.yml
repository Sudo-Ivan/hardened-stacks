services:
  kaneo:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${KANEO_IMAGE:-ghcr.io/sudo-ivan/hardened-stacks/kaneo:local}
    restart: unless-stopped
    user: "1001:1001"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - KANEO_CLIENT_URL=${KANEO_CLIENT_URL:-http://127.0.0.1:5173}
      - AUTH_SECRET=${KANEO_AUTH_SECRET:?}
      - POSTGRES_DB=kaneo
      - POSTGRES_USER=kaneo
      - POSTGRES_PASSWORD=${KANEO_DB_PASSWORD:?}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://kaneo:${KANEO_DB_PASSWORD:?}@postgres:5432/kaneo
      - TZ=${TZ:-UTC}
      # GitHub App integration (optional; unset/empty disables it).
      # Prefer GITHUB_PRIVATE_KEY_BASE64 over the multi-line PEM var.
      - GITHUB_APP_ID=${KANEO_GITHUB_APP_ID:-}
      - GITHUB_APP_NAME=${KANEO_GITHUB_APP_NAME:-}
      - GITHUB_WEBHOOK_SECRET=${KANEO_GITHUB_WEBHOOK_SECRET:-}
      - GITHUB_PRIVATE_KEY=${KANEO_GITHUB_PRIVATE_KEY:-}
      - GITHUB_PRIVATE_KEY_BASE64=${KANEO_GITHUB_PRIVATE_KEY_BASE64:-}
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=16m,mode=1777
      - /run:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  postgres:
    image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    restart: unless-stopped
    environment:
      - POSTGRES_USER=kaneo
      - POSTGRES_PASSWORD=${KANEO_DB_PASSWORD:?}
      - POSTGRES_DB=kaneo
      - TZ=${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
