name: mirotalk

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  coturn:
    image: docker.io/coturn/coturn:latest@sha256:59af4221a2c45c1195a1a4a865542b3ea744be1dd8e228d11bde87c6631081cf
    restart: unless-stopped
    user: "65534:65534"
    environment:
      - TZ=${TZ:-UTC}
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --log-file=stdout
      - --realm=${COTURN_REALM:?}
      - --server-name=${COTURN_REALM:?}
      - --user=mirotalk:${SERVICE_PASSWORD_COTURN:?}
      - --external-ip=${COTURN_EXTERNAL_IP:?}
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - type: bind
        source: ./config/turnserver.conf
        target: /etc/coturn/turnserver.conf
        content: |
          listening-port=3478
          fingerprint
          lt-cred-mech
          no-cli
          no-tls
          no-dtls
          no-multicast-peers
          no-loopback-peers
          no-software-attribute
          simple-log
          log-file=stdout
          min-port=49160
          max-port=49200
          total-quota=100
          user-quota=10
          stale-nonce=600
          denied-peer-ip=0.0.0.0-0.255.255.255
          denied-peer-ip=10.0.0.0-10.255.255.255
          denied-peer-ip=100.64.0.0-100.127.255.255
          denied-peer-ip=127.0.0.0-127.255.255.255
          denied-peer-ip=169.254.0.0-169.254.255.255
          denied-peer-ip=172.16.0.0-172.31.255.255
          denied-peer-ip=192.0.0.0-192.0.0.255
          denied-peer-ip=192.0.2.0-192.0.2.255
          denied-peer-ip=192.168.0.0-192.168.255.255
          denied-peer-ip=198.18.0.0-198.19.255.255
          denied-peer-ip=198.51.100.0-198.51.100.255
          denied-peer-ip=203.0.113.0-203.0.113.255
          denied-peer-ip=224.0.0.0-239.255.255.255
          denied-peer-ip=240.0.0.0-255.255.255.255
          denied-peer-ip=::1
          denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
          denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/tmp:size=16m,mode=1777
      - /var/lib/coturn:size=16m,mode=1777
    networks:
      - mirotalk
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  mirotalk:
    image: docker.io/mirotalk/p2p:latest@sha256:6bfe767026f6666d21e22988064776f1386282fc50660198cb5c3273bdb5d35f
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      - coturn
    environment:
      - SERVICE_FQDN_MIROTALK_3000
      - NODE_ENV=production
      - HOST=${MIROTALK_HOST:?}
      - PORT=3000
      - TRUST_PROXY=true
      - TZ=${TZ:-UTC}
      - LOGS_DEBUG=false
      - LOGS_COLORS=false
      - SURVEY_ENABLED=false
      - STATS_ENABLED=false
      - SENTRY_ENABLED=false
      - NGROK_ENABLED=false
      - CHATGPT_ENABLED=false
      - WHISPER_ENABLED=false
      - SLACK_ENABLED=false
      - MATTERMOST_ENABLED=false
      - EMAIL_ALERT=false
      - IP_LOOKUP_ENABLED=false
      - OIDC_ENABLED=false
      - HOST_PROTECTED=${MIROTALK_HOST_PROTECTED:-false}
      - HOST_USER_AUTH=${MIROTALK_HOST_USER_AUTH:-false}
      - STUN_SERVER_ENABLED=true
      - STUN_SERVER_URL=${MIROTALK_STUN_URL:-stun:${COTURN_REALM:?}:3478}
      - TURN_SERVER_ENABLED=true
      - TURN_SERVER_URL=${MIROTALK_TURN_URL:?}
      - TURN_SERVER_USERNAME=mirotalk
      - TURN_SERVER_CREDENTIAL=${SERVICE_PASSWORD_COTURN:?}
      - JWT_KEY=${SERVICE_PASSWORD_MIROTALKJWT:?}
      - API_KEY_SECRET=${SERVICE_PASSWORD_MIROTALKAPI:?}
      - SESSION_SECRET=${SERVICE_PASSWORD_MIROTALKSESSION:?}
      - REDIRECT_ENABLED=false
      - ALLOWED_EMBED_ORIGINS=${MIROTALK_ALLOWED_EMBED_ORIGINS:-none}
    expose:
      - "3000"
    volumes:
      - type: bind
        source: ./logo.svg
        target: /src/public/images/logo.svg
        content: |
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quad4">
            <rect width="64" height="64" rx="14" fill="#0a0a0b"/>
            <g transform="translate(32 32) scale(24)" fill="#ffffff" fill-rule="nonzero">
              <path d="M 0.10097 -0.97999 L 0.09859 -0.69728 L 0.39556 -0.52385 L 0.09859 -0.35517 L 0.09859 -0.11522 L 0.83983 -0.54286 Z"/>
              <path d="M -0.09859 -0.97762 L -0.83745 -0.54523 L -0.10097 -0.11760 L -0.09622 -0.35517 L -0.39081 -0.52385 L -0.09622 -0.69728 Z"/>
              <path d="M -0.86121 -0.49059 L -0.86121 0.36943 L -0.62363 0.23163 L -0.62126 -0.10810 L -0.32666 0.06533 L -0.11285 -0.05821 Z"/>
              <path d="M 0.86121 -0.49059 L 0.11998 -0.05821 L 0.33142 0.06533 L 0.62363 -0.10572 L 0.62601 0.23163 L 0.86121 0.36705 Z"/>
              <path d="M 0.07008 0.19362 L 0.07008 0.98237 L 0.79231 0.54761 L 0.56424 0.41219 L 0.26252 0.59750 L 0.26014 0.30291 Z"/>
              <path d="M -0.07008 0.19600 L -0.25777 0.30291 L -0.26014 0.59750 L -0.56186 0.41219 L -0.78993 0.54761 L -0.07008 0.97999 Z"/>
            </g>
          </svg>
      - type: bind
        source: ./favicon.svg
        target: /src/public/images/favicon.svg
        content: |
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quad4">
            <rect width="64" height="64" rx="14" fill="#0a0a0b"/>
            <g transform="translate(32 32) scale(24)" fill="#ffffff" fill-rule="nonzero">
              <path d="M 0.10097 -0.97999 L 0.09859 -0.69728 L 0.39556 -0.52385 L 0.09859 -0.35517 L 0.09859 -0.11522 L 0.83983 -0.54286 Z"/>
              <path d="M -0.09859 -0.97762 L -0.83745 -0.54523 L -0.10097 -0.11760 L -0.09622 -0.35517 L -0.39081 -0.52385 L -0.09622 -0.69728 Z"/>
              <path d="M -0.86121 -0.49059 L -0.86121 0.36943 L -0.62363 0.23163 L -0.62126 -0.10810 L -0.32666 0.06533 L -0.11285 -0.05821 Z"/>
              <path d="M 0.86121 -0.49059 L 0.11998 -0.05821 L 0.33142 0.06533 L 0.62363 -0.10572 L 0.62601 0.23163 L 0.86121 0.36705 Z"/>
              <path d="M 0.07008 0.19362 L 0.07008 0.98237 L 0.79231 0.54761 L 0.56424 0.41219 L 0.26252 0.59750 L 0.26014 0.30291 Z"/>
              <path d="M -0.07008 0.19600 L -0.25777 0.30291 L -0.26014 0.59750 L -0.56186 0.41219 L -0.78993 0.54761 L -0.07008 0.97999 Z"/>
            </g>
          </svg>
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - mirotalk
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

networks:
  mirotalk:
    driver: bridge
