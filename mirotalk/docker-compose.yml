name: mirotalk

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  mirotalk:
    image: docker.io/mirotalk/p2p:latest@sha256:6bfe767026f6666d21e22988064776f1386282fc50660198cb5c3273bdb5d35f
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - NODE_ENV=production
      - HOST=${MIROTALK_HOST:-http://127.0.0.1:3000}
      - PORT=3000
      - TRUST_PROXY=${MIROTALK_TRUST_PROXY:-false}
      - TZ=${TZ:-UTC}
      - LOGS_DEBUG=false
      - LOGS_COLORS=false
      - SURVEY_ENABLED=false
      - STATS_ENABLED=false
      - SENTRY_ENABLED=false
      - NGROK_ENABLED=false
      - CHATGPT_ENABLED=false
      - WHISPER_ENABLED=false
      - SLACK_ENABLED=false
      - MATTERMOST_ENABLED=false
      - EMAIL_ALERT=false
      - IP_LOOKUP_ENABLED=false
      - OIDC_ENABLED=false
      - HOST_PROTECTED=${MIROTALK_HOST_PROTECTED:-false}
      - HOST_USER_AUTH=${MIROTALK_HOST_USER_AUTH:-false}
      - STUN_SERVER_ENABLED=true
      - STUN_SERVER_URL=${MIROTALK_STUN_URL:-stun:stun.l.google.com:19302}
      - TURN_SERVER_ENABLED=${MIROTALK_TURN_ENABLED:-false}
      - TURN_SERVER_URL=${MIROTALK_TURN_URL:-}
      - TURN_SERVER_USERNAME=${MIROTALK_TURN_USERNAME:-}
      - TURN_SERVER_CREDENTIAL=${MIROTALK_TURN_CREDENTIAL:-}
      - JWT_KEY=${MIROTALK_JWT_KEY:?}
      - API_KEY_SECRET=${MIROTALK_API_KEY_SECRET:?}
      - SESSION_SECRET=${MIROTALK_SESSION_SECRET:?}
      - REDIRECT_ENABLED=false
      - ALLOWED_EMBED_ORIGINS=${MIROTALK_ALLOWED_EMBED_ORIGINS:-none}
    ports:
      - "127.0.0.1:${MIROTALK_PORT:-3000}:3000"
    volumes:
      - ../branding/mark.svg:/src/public/images/logo.svg:ro
      - ../branding/mark.svg:/src/public/images/favicon.svg:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - mirotalk
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

networks:
  mirotalk:
    driver: bridge
