name: zitadel

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_ZITADELDB:?}
      - POSTGRES_DB=zitadel
      - TZ=${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m
    networks:
      - zitadel
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zitadel"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.17.3@sha256:2ec2a42551862ca59dc752c321c7041358dea8b33b63ea5e021ec499ad5e2d9f
    restart: unless-stopped
    # Upstream runs this as root so the bootstrap volume stays writable.
    user: "0"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start-from-init", "--masterkey", "${SERVICE_PASSWORD_ZITADELMASTERKEY:?}"]
    environment:
      - SERVICE_FQDN_ZITADEL_API_8080
      - ZITADEL_PORT=8080
      - ZITADEL_EXTERNALDOMAIN=${ZITADEL_EXTERNALDOMAIN:?}
      - ZITADEL_EXTERNALPORT=443
      - ZITADEL_EXTERNALSECURE=true
      - ZITADEL_TLS_ENABLED=false
      - ZITADEL_DATABASE_POSTGRES_DSN=postgresql://postgres:${SERVICE_PASSWORD_ZITADELDB}@postgres:5432/zitadel?sslmode=disable
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD=${ZITADEL_ADMIN_PASSWORD:-Password1!}
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED=false
      - ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH=/zitadel/bootstrap/login-client.pat
      - ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME=login-client
      - ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME=Automatically Initialized IAM_LOGIN_CLIENT
      - ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE=${LOGIN_CLIENT_PAT_EXPIRATION:-2099-01-01T00:00:00Z}
      - ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED=true
      - ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI=https://${ZITADEL_EXTERNALDOMAIN:?}/ui/v2/login/
      - ZITADEL_OIDC_DEFAULTLOGINURLV2=https://${ZITADEL_EXTERNALDOMAIN}/ui/v2/login/login?authRequest=
      - ZITADEL_OIDC_DEFAULTLOGOUTURLV2=https://${ZITADEL_EXTERNALDOMAIN}/ui/v2/login/logout?post_logout_redirect=
      - ZITADEL_SAML_DEFAULTLOGINURLV2=https://${ZITADEL_EXTERNALDOMAIN}/ui/v2/login/login?samlRequest=
      - ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED=true
      - TZ=${TZ:-UTC}
    expose:
      - "8080"
    volumes:
      - bootstrap:/zitadel/bootstrap
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - zitadel
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    logging: *default-logging

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.17.3@sha256:07ae03bd1aa49dbc015617a0c1bc9e6abd956616856f0bb374269fae7da79059
    restart: unless-stopped
    # Reads the root-written login-client PAT from the bootstrap volume.
    user: "0"
    depends_on:
      zitadel-api:
        condition: service_healthy
    environment:
      - ZITADEL_API_URL=http://zitadel-api:8080
      - NEXT_PUBLIC_BASE_PATH=/ui/v2/login
      - ZITADEL_SERVICE_USER_TOKEN_FILE=/zitadel/bootstrap/login-client.pat
      - CUSTOM_REQUEST_HEADERS=Host:${ZITADEL_EXTERNALDOMAIN:?},X-Forwarded-Proto:https
      - TZ=${TZ:-UTC}
    expose:
      - "3000"
    volumes:
      - bootstrap:/zitadel/bootstrap:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - zitadel
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs", "http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    logging: *default-logging

volumes:
  postgres_data:
  bootstrap:

networks:
  zitadel:
    driver: bridge
