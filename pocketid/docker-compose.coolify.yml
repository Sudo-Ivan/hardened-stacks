name: pocketid

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  pocket-id-init:
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - pocketid_data:/data
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.16.0-distroless@sha256:f5ce1e58392f48a8fb8a1ff22a714272a49a52b8582d87deb530823f95359204
    restart: unless-stopped
    user: "65532:65532"
    depends_on:
      pocket-id-init:
        condition: service_completed_successfully
    environment:
      - SERVICE_FQDN_POCKET_ID_1411
      - APP_URL=${POCKETID_APP_URL:?}
      - ENCRYPTION_KEY=${SERVICE_PASSWORD_POCKETID:?}
      - TRUST_PROXY=${POCKETID_TRUST_PROXY:-true}
      - ALLOW_INSECURE_CALLBACK_URLS=${POCKETID_ALLOW_INSECURE_CALLBACK_URLS:-false}
      - ANALYTICS_DISABLED=${POCKETID_ANALYTICS_DISABLED:-false}
      - VERSION_CHECK_DISABLED=${POCKETID_VERSION_CHECK_DISABLED:-false}
      - MAXMIND_LICENSE_KEY=${POCKETID_MAXMIND_LICENSE_KEY:-}
      - TZ=${TZ:-UTC}
    expose:
      - "1411"
    volumes:
      - pocketid_data:/app/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - pocketid
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

volumes:
  pocketid_data:

networks:
  pocketid:
    driver: bridge
