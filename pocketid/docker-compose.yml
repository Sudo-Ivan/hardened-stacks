name: pocketid

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  pocket-id-init:
    image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    restart: "no"
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - pocketid_data:/data
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.18.0-distroless@sha256:138d106737498f6c20d0bec854b872bc77ec520d7a9b54502444a260a49c41cb
    restart: unless-stopped
    user: "65532:65532"
    depends_on:
      pocket-id-init:
        condition: service_completed_successfully
    environment:
      - APP_URL=${POCKETID_APP_URL:-http://localhost:1411}
      - ENCRYPTION_KEY=${POCKETID_ENCRYPTION_KEY:?}
      - TRUST_PROXY=${POCKETID_TRUST_PROXY:-false}
      - ALLOW_INSECURE_CALLBACK_URLS=${POCKETID_ALLOW_INSECURE_CALLBACK_URLS:-false}
      - ANALYTICS_DISABLED=${POCKETID_ANALYTICS_DISABLED:-false}
      - VERSION_CHECK_DISABLED=${POCKETID_VERSION_CHECK_DISABLED:-false}
      - MAXMIND_LICENSE_KEY=${POCKETID_MAXMIND_LICENSE_KEY:-}
      - TZ=${TZ:-UTC}
    ports:
      - "127.0.0.1:${POCKETID_PORT:-1411}:1411"
    volumes:
      - pocketid_data:/app/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - pocketid
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

volumes:
  pocketid_data:

networks:
  pocketid:
    driver: bridge
