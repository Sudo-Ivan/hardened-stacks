name: livekit

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  livekit:
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"
      - UDP_PORT=${LIVEKIT_UDP_PORT:-7882}
      - LIVEKIT_RTC_TCP_PORT=7881
      - LIVEKIT_RTC_USE_EXTERNAL_IP=${LIVEKIT_USE_EXTERNAL_IP:-true}
      - TZ=${TZ:-UTC}
    expose:
      - "7880"
    ports:
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    networks:
      - livekit
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

networks:
  livekit:
    driver: bridge
