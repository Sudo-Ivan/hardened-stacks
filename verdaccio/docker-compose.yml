name: verdaccio

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  verdaccio:
    image: verdaccio/verdaccio:6.10.4@sha256:43c4067288b050422265407ea2fe747e511fcd0c407a85ec90ab9a326d9400cd
    restart: unless-stopped
    user: "10001:10001"
    environment:
      - VERDACCIO_PORT=4873
      - VERDACCIO_PROTOCOL=http
      - VERDACCIO_ADDRESS=0.0.0.0
      - VERDACCIO_PUBLIC_URL=${VERDACCIO_PUBLIC_URL:-http://127.0.0.1:4873}
      - TZ=${TZ:-UTC}
    ports:
      - "127.0.0.1:${VERDACCIO_PORT:-4873}:4873"
    volumes:
      - verdaccio_storage:/verdaccio/storage
      - ./config/config.yaml:/verdaccio/conf/config.yaml:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - verdaccio
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4873/-/ping',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

volumes:
  verdaccio_storage:

networks:
  verdaccio:
    driver: bridge
