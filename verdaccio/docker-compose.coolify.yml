name: verdaccio

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  verdaccio:
    image: ghcr.io/quad4-software/verdaccio:nightly-master@sha256:d778921c691ae2fdde781e2f7b4222a9ccf93159d7d640dc60df41794ef7c765
    restart: unless-stopped
    user: "10001:10001"
    environment:
      - SERVICE_FQDN_VERDACCIO_4873
      - VERDACCIO_PORT=4873
      - VERDACCIO_PROTOCOL=http
      - VERDACCIO_ADDRESS=0.0.0.0
      - VERDACCIO_PUBLIC_URL=${VERDACCIO_PUBLIC_URL:?}
      - TZ=${TZ:-UTC}
    expose:
      - "4873"
    volumes:
      - verdaccio_storage:/verdaccio/storage
      - type: bind
        source: ./config/config.yaml
        target: /verdaccio/conf/config.yaml
        content: |
          storage: /verdaccio/storage/data
          plugins: /verdaccio/plugins

          web:
            title: Verdaccio
            darkMode: false
            login: true
            showVersion: false

          auth:
            htpasswd:
              file: /verdaccio/storage/htpasswd
              max_users: 1

          uplinks:
            npmjs:
              url: https://registry.npmjs.org/
              maxage: 30m
              timeout: 30s
              fail_timeout: 5m
              max_fails: 5
              cache: true

          packages:
            "@local/*":
              access: $$authenticated
              publish: $$authenticated
              unpublish: $$authenticated

            "@*/*":
              access: $$authenticated
              publish: $$authenticated
              unpublish: $$authenticated
              proxy: npmjs

            "**":
              access: $$authenticated
              publish: $$authenticated
              unpublish: $$authenticated
              proxy: npmjs

          server:
            keepAliveTimeout: 60
            dotfiles: deny
            trustProxy: true
            passwordValidationRegex: "^.{12,}$$"

          security:
            api:
              jwt:
                sign:
                  expiresIn: 15d
            web:
              sign:
                expiresIn: 1h

          middlewares:
            audit:
              enabled: true

          log:
            type: stdout
            format: pretty
            level: http

          i18n:
            web: en-US
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - verdaccio
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4873/-/ping',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

volumes:
  verdaccio_storage:

networks:
  verdaccio:
    driver: bridge
