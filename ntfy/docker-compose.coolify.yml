name: ntfy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    restart: unless-stopped
    user: "1000:1000"
    command: ["serve"]
    environment:
      - SERVICE_FQDN_NTFY_8080
      - NTFY_LISTEN_HTTP=:8080
      - NTFY_BASE_URL=${NTFY_BASE_URL:?}
      - NTFY_BEHIND_PROXY=true
      - NTFY_CACHE_FILE=/tmp/cache.db
      - NTFY_AUTH_DEFAULT_ACCESS=read-write
      - NTFY_ENABLE_LOGIN=false
      - NTFY_ENABLE_SIGNUP=false
      - NTFY_UPSTREAM_BASE_URL=${NTFY_UPSTREAM_BASE_URL:-https://ntfy.sh}
      - NTFY_VISITOR_SUBSCRIBER_RATE_LIMITING=true
      - NTFY_VISITOR_MESSAGE_DAILY_LIMIT=${NTFY_VISITOR_MESSAGE_DAILY_LIMIT:-5000}
      - TZ=${TZ:-UTC}
    expose:
      - "8080"
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - ntfy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

networks:
  ntfy:
    driver: bridge
