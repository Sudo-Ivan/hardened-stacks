name: ntfy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /tmp/ntfy/attachments && exec ntfy serve"]
    environment:
      - NTFY_LISTEN_HTTP=:8080
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://127.0.0.1:8080}
      - NTFY_CACHE_FILE=/tmp/ntfy/cache.db
      - NTFY_ATTACHMENT_CACHE_DIR=/tmp/ntfy/attachments
      - NTFY_AUTH_DEFAULT_ACCESS=${NTFY_AUTH_DEFAULT_ACCESS:-read-write}
      - NTFY_ENABLE_LOGIN=true
      - TZ=${TZ:-UTC}
    ports:
      - "127.0.0.1:${NTFY_PORT:-8080}:8080"
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - ntfy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

networks:
  ntfy:
    driver: bridge
