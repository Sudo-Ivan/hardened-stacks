name: bugpin

services:
  bugpin:
    image: ${BUGPIN_IMAGE:-ghcr.io/sudo-ivan/hardened-stacks/bugpin:latest}
    restart: unless-stopped
    user: "1000:1000"
    stop_grace_period: 15s
    expose:
      - "7300"
    environment:
      - SERVICE_URL_BUGPIN_7300
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATA_DIR=/data
      - NODE_ENV=production
      - TZ=${TZ:-UTC}
    volumes:
      - bugpin_data:/data
    tmpfs:
      - /tmp:size=128m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7300/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  bugpin_data:
