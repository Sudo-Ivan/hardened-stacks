name: zot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  zot-init:
    image: httpd:2.4.65-alpine@sha256:07b2fabb7029a0b8aeb2e0fd02651c28fe22c21c5b5a59d6ff5b022791fcd89e
    restart: "no"
    exclude_from_hc: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "zot-init: writing bcrypt htpasswd for user admin"
        htpasswd -bnB admin "${ZOT_PASSWORD:?}" > /auth/htpasswd
        chmod 644 /auth/htpasswd
        mkdir -p /data
        echo "zot-init: chown data and auth to 65532"
        chown -R 65532:65532 /data /auth
        echo "zot-init: done"
    environment:
      - ZOT_PASSWORD=${SERVICE_PASSWORD_ZOTADMIN:?}
    volumes:
      - zot_data:/data
      - zot_auth:/auth
    networks:
      - zot
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  zot:
    image: ghcr.io/quad4-software/zot:latest@sha256:519e06d51d02ed42bc9aaf3f5dcee2215118f53b4a4f0f6ff6fff372384d9fda
    restart: unless-stopped
    user: "65532:65532"
    depends_on:
      zot-init:
        condition: service_completed_successfully
    command: ["serve", "/etc/zot/config.json"]
    environment:
      - SERVICE_FQDN_ZOT_8080
      - TZ=${TZ:-UTC}
    expose:
      - "8080"
    volumes:
      - zot_data:/var/lib/zot
      - zot_auth:/auth:ro
      - type: bind
        source: ./config/config.json
        target: /etc/zot/config.json
        content: |
          {
            "distSpecVersion": "1.1.1",
            "storage": {
              "rootDirectory": "/var/lib/zot",
              "dedupe": true,
              "gc": true,
              "gcDelay": "1h",
              "gcInterval": "24h"
            },
            "http": {
              "address": "0.0.0.0",
              "port": "8080",
              "realm": "zot",
              "compat": ["docker2s2"],
              "auth": {
                "htpasswd": {
                  "path": "/auth/htpasswd"
                },
                "apikey": true,
                "failDelay": 5
              },
              "accessControl": {
                "metrics": {
                  "users": ["admin"]
                },
                "repositories": {
                  "public/**": {
                    "anonymousPolicy": ["read"],
                    "defaultPolicy": ["read"]
                  },
                  "**": {
                    "defaultPolicy": ["read", "create", "update", "delete"]
                  }
                },
                "adminPolicy": {
                  "users": ["admin"],
                  "actions": ["read", "create", "update", "delete"]
                }
              },
              "ratelimit": {
                "rate": 100,
                "methods": [
                  {
                    "method": "GET",
                    "rate": 50
                  }
                ]
              }
            },
            "log": {
              "level": "info"
            },
            "extensions": {
              "search": {
                "enable": true,
                "cve": {
                  "updateInterval": "24h",
                  "trivy": {
                    "dbRepository": "ghcr.io/aquasecurity/trivy-db",
                    "javaDBRepository": "ghcr.io/aquasecurity/trivy-java-db"
                  }
                }
              },
              "metrics": {
                "enable": true,
                "prometheus": {
                  "path": "/metrics"
                }
              },
              "ui": {
                "enable": true
              },
              "scrub": {
                "enable": true,
                "interval": "24h"
              }
            },
            "landlock": true
          }
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - zot
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  zot_data:
  zot_auth:

networks:
  zot:
    driver: bridge
