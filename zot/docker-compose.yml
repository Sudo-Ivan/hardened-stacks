name: zot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  zot-init:
    image: httpd:2.4.65-alpine@sha256:07b2fabb7029a0b8aeb2e0fd02651c28fe22c21c5b5a59d6ff5b022791fcd89e
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "zot-init: writing bcrypt htpasswd for user admin"
        htpasswd -bnB admin "${ZOT_PASSWORD:?}" > /auth/htpasswd
        chmod 644 /auth/htpasswd
        mkdir -p /data
        echo "zot-init: chown data and auth to 10001"
        chown -R 10001:10001 /data /auth
        echo "zot-init: done"
    environment:
      - ZOT_PASSWORD=${ZOT_PASSWORD:?}
    volumes:
      - zot_data:/data
      - zot_auth:/auth
    networks:
      - zot
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  zot:
    image: ghcr.io/project-zot/zot:v2.1.21@sha256:6b69512c00dceaad05b1144e6079aac6aa7309d7fd200f9947ecb1de09cf48c8
    restart: unless-stopped
    user: "10001:10001"
    depends_on:
      zot-init:
        condition: service_completed_successfully
    command: ["serve", "/etc/zot/config.json"]
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "127.0.0.1:${ZOT_PORT:-8080}:8080"
    volumes:
      - zot_data:/var/lib/zot
      - zot_auth:/auth:ro
      - ./config/config.json:/etc/zot/config.json:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - zot
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  zot_data:
  zot_auth:

networks:
  zot:
    driver: bridge
