name: zot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  zot-init:
    image: docker.io/library/httpd:2.4.68-alpine@sha256:4e585da9d0125dec36d4500a9f5c5df7b2c0a01f67cb47865a91a4b05bdbec1b
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "zot-init: writing bcrypt htpasswd for user admin"
        htpasswd -bnB admin "${ZOT_PASSWORD:?}" > /auth/htpasswd
        chmod 644 /auth/htpasswd
        mkdir -p /data
        echo "zot-init: chown data and auth to 65532"
        chown -R 65532:65532 /data /auth
        echo "zot-init: done"
    environment:
      - ZOT_PASSWORD=${ZOT_PASSWORD:?}
    volumes:
      - zot_data:/data
      - zot_auth:/auth
    networks:
      - zot
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  zot:
    image: ghcr.io/quad4-software/zot:latest@sha256:3d33211e241036f5b0e431a4d5c1c95948242b532d37feff9306e7b9bc10c77f
    restart: unless-stopped
    user: "65532:65532"
    depends_on:
      zot-init:
        condition: service_completed_successfully
    command: ["serve", "/etc/zot/config.json"]
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "127.0.0.1:${ZOT_PORT:-8080}:8080"
    volumes:
      - zot_data:/var/lib/zot
      - zot_auth:/auth:ro
      - ./config/config.json:/etc/zot/config.json:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - zot
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  zot_data:
  zot_auth:

networks:
  zot:
    driver: bridge
