hardened-stacks-spam-protection:
  admin:
    settings:
      enabled_label: Enable AI spam protection
      enabled_help: "Requires an API key below or SPAM_AI_API_KEY in the environment. Works with OpenAI-compatible providers including OpenRouter."
      api_key_label: API key
      api_key_help: "Saved in Flarum settings. If empty, SPAM_AI_API_KEY from the environment is used."
      base_url_label: API base URL
      base_url_help: "OpenAI-compatible root ending in /v1. Examples: https://openrouter.ai/api/v1 or https://api.openai.com/v1. If empty, SPAM_AI_BASE_URL or OpenRouter is used."
      model_label: Model
      model_help: "Provider model id. Examples: openai/gpt-4o-mini (OpenRouter) or gpt-4o-mini (OpenAI). If empty, SPAM_AI_MODEL or openai/gpt-4o-mini is used."
      monitor_posts_label: Monitor posts and discussions
      monitor_posts_help: Classify new posts after they are created and apply moderation actions when spam is detected.
      monitor_new_users_label: Monitor new registrations
      monitor_new_users_help: Classify new accounts at signup and suspend obvious bot registrations.
      new_user_days_label: New member period (days)
      new_user_days_help: Accounts younger than this are flagged as new in AI context. Set to 0 to ignore age.
      new_user_post_count_label: New member post count
      new_user_post_count_help: Members with fewer posts than this are flagged as new in AI context. Set to 0 to ignore count.
      min_confidence_label: Minimum confidence (0-100)
      min_confidence_help: Only take action when the model confidence is at least this high.
      action_hide_post_label: Allow hiding spam posts
      action_hide_discussion_label: Allow hiding spam discussions
      action_lock_discussion_label: Allow locking spam discussions
      action_lock_discussion_help: Requires the Flarum Lock extension so discussions have an is_locked column.
      action_suspend_user_label: Allow suspending spam users
      action_suspend_user_help: Requires the Flarum Suspend extension.
      suspend_days_label: Suspension length (days)
      suspend_days_help: How long to suspend a user when the model recommends suspension.
      fail_open_label: Fail open on AI errors
      fail_open_help: When enabled, API failures leave content alone. When disabled, failed checks hide the post.
