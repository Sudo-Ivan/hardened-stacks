services:
  mcaptcha:
    image: mcaptcha/mcaptcha:latest
    restart: unless-stopped
    expose:
      - "7000"
    environment:
      - PORT=7000
      - MCAPTCHA_redis_URL=redis://mcaptcha_redis/
      - MCAPTCHA_allow_registration=true
      - DATABASE_URL=postgres://mcaptcha:${MCAPTCHA_DB_PASSWORD:?}@mcaptcha_postgres:5432/mcaptcha
    depends_on:
      mcaptcha_postgres:
        condition: service_healthy
      mcaptcha_redis:
        condition: service_started

  mcaptcha_postgres:
    image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mcaptcha
      - POSTGRES_PASSWORD=${MCAPTCHA_DB_PASSWORD:?}
      - POSTGRES_DB=mcaptcha
    volumes:
      - mcaptcha_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcaptcha -d mcaptcha"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mcaptcha_redis:
    image: mcaptcha/cache:latest
    restart: unless-stopped

volumes:
  mcaptcha_data:
