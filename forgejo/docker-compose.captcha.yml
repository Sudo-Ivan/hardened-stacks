services:
  mcaptcha:
    image: mcaptcha/mcaptcha:latest@sha256:e94486fe8ae2549977d4245fd48c0cf53ea03092b8412bc283e8dd1c3ca27717
    restart: unless-stopped
    expose:
      - "7000"
    environment:
      - PORT=7000
      - MCAPTCHA_redis_URL=redis://mcaptcha_redis/
      - MCAPTCHA_allow_registration=true
      - DATABASE_URL=postgres://mcaptcha:${MCAPTCHA_DB_PASSWORD:?}@mcaptcha_postgres:5432/mcaptcha
    depends_on:
      mcaptcha_postgres:
        condition: service_healthy
      mcaptcha_redis:
        condition: service_started

  mcaptcha_postgres:
    image: postgres:16-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mcaptcha
      - POSTGRES_PASSWORD=${MCAPTCHA_DB_PASSWORD:?}
      - POSTGRES_DB=mcaptcha
    volumes:
      - mcaptcha_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcaptcha -d mcaptcha"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mcaptcha_redis:
    image: mcaptcha/cache:latest@sha256:56cb11d8cffb04c00dc6008c08d795a61cdacaab388cababa3c52cfc2ec6cc7a
    restart: unless-stopped

volumes:
  mcaptcha_data:
