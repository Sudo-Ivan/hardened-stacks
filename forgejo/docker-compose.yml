services:
  forgejo:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FORGEJO_IMAGE:-ghcr.io/sudo-ivan/hardened-stacks/forgejo:local}
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2222:2222"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO_ROOT_URL=${FORGEJO_ROOT_URL:-http://127.0.0.1:3000}
      - FORGEJO_APP_NAME=${FORGEJO_APP_NAME:-Hardened Stacks Forgejo}
      - FORGEJO_APP_SLOGAN=${FORGEJO_APP_SLOGAN:-}
      - FORGEJO_LOGO_URL=${FORGEJO_LOGO_URL:-none}
      - FORGEJO_FAVICON_URL=${FORGEJO_FAVICON_URL:-}
      - FORGEJO_DEFAULT_THEME=${FORGEJO_DEFAULT_THEME:-forgejo-auto}
      - FORGEJO_THEMES=${FORGEJO_THEMES:-}
      - FORGEJO_CUSTOM_CSS_URL=${FORGEJO_CUSTOM_CSS_URL:-}
      - FORGEJO_DB_PASSWORD=${FORGEJO_DB_PASSWORD:?}
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=postgres:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${FORGEJO_DB_PASSWORD:?}
      - FORGEJO_DISABLE_REGISTRATION=${FORGEJO_DISABLE_REGISTRATION:-false}
      - FORGEJO_ENABLE_IMAGE_CAPTCHA=${FORGEJO_ENABLE_IMAGE_CAPTCHA:-false}
      - FORGEJO_MCAPTCHA_URL=${FORGEJO_MCAPTCHA_URL:-}
      - FORGEJO_MCAPTCHA_SITEKEY=${FORGEJO_MCAPTCHA_SITEKEY:-}
      - FORGEJO_MCAPTCHA_SECRET=${FORGEJO_MCAPTCHA_SECRET:-}
      - FORGEJO_REQUIRE_CAPTCHA_FOR_LOGIN=${FORGEJO_REQUIRE_CAPTCHA_FOR_LOGIN:-false}
      - TZ=${TZ:-UTC}
    volumes:
      - forgejo_data:/var/lib/gitea
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  postgres:
    image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    restart: unless-stopped
    environment:
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=${FORGEJO_DB_PASSWORD:?}
      - POSTGRES_DB=forgejo
      - TZ=${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  forgejo_data:
  postgres_data:
