name: ci

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backup-cli:
    name: flarum-backup-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: flarum-backup-cli/go.mod
          cache: true
          cache-dependency-path: flarum-backup-cli/go.mod

      - name: Check
        working-directory: flarum-backup-cli
        run: make check

  docker-build:
    name: flarum image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FLARUM_FORUM_TITLE: ci
      FLARUM_ADMIN_EMAIL: ci@example.com
      SERVICE_URL_FLARUM_8080: http://localhost
      SERVICE_PASSWORD_FLARUMADMIN: ci-admin-pass
      SERVICE_PASSWORD_FLARUMDB: ci-db-pass
      SERVICE_PASSWORD_FLARUMROOT: ci-root-pass
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: flarum/Dockerfile
          push: false
          load: true
          tags: ghcr.io/sudo-ivan/hardened-stacks/flarum:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke backup CLI
        run: docker run --rm --entrypoint flarum-backup ghcr.io/sudo-ivan/hardened-stacks/flarum:ci version
