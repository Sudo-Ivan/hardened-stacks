name: ci

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backup-cli:
    name: flarum-backup-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: flarum-backup-cli/go.mod
          cache: true
          cache-dependency-path: flarum-backup-cli/go.mod

      - name: Check
        working-directory: flarum-backup-cli
        run: make check

  docker-build:
    name: flarum image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FLARUM_FORUM_TITLE: ci
      FLARUM_ADMIN_EMAIL: ci@example.com
      SERVICE_URL_RAVENGUARD_8080: http://localhost:8080
      SERVICE_PASSWORD_FLARUMADMIN: ci-admin-pass
      SERVICE_PASSWORD_FLARUMDB: ci-db-pass
      SERVICE_PASSWORD_FLARUMROOT: ci-root-pass
      SERVICE_PASSWORD_RAVENGUARD: ci-rg-challenge-secret!!
      SERVICE_PASSWORD_RAVENGUARDADMIN: ci-rg-admin-pass
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build flarum image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: flarum/Dockerfile
          push: false
          load: true
          tags: ghcr.io/sudo-ivan/hardened-stacks/flarum:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=flarum
          cache-to: type=gha,mode=max,scope=flarum

      - name: Build ravenguard image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ravenguard
          file: ravenguard/Dockerfile
          push: false
          load: true
          tags: ghcr.io/sudo-ivan/hardened-stacks/ravenguard:ci
          cache-from: type=gha,scope=ravenguard
          cache-to: type=gha,mode=max,scope=ravenguard

      - name: Smoke backup CLI
        run: docker run --rm --entrypoint flarum-backup ghcr.io/sudo-ivan/hardened-stacks/flarum:ci version

      - name: Smoke forum health endpoint
        working-directory: flarum
        env:
          FLARUM_IMAGE: ghcr.io/sudo-ivan/hardened-stacks/flarum:ci
          RAVENGUARD_IMAGE: ghcr.io/sudo-ivan/hardened-stacks/ravenguard:ci
        run: |
          docker compose up -d --no-build
          trap 'docker compose down -v' EXIT
          for i in $(seq 1 60); do
            if docker compose exec -T flarum curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker compose logs flarum
              exit 1
            fi
            sleep 3
          done
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            if [ "$code" = "200" ] || [ "$code" = "403" ] || [ "$code" = "429" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs ravenguard
          exit 1

  mediawiki-build:
    name: mediawiki image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MEDIAWIKI_SITE_NAME: ci
      MEDIAWIKI_ADMIN_EMAIL: ci@example.com
      MEDIAWIKI_ADMIN_PASSWORD: ci-admin-pass
      MEDIAWIKI_DB_PASSWORD: ci-db-pass
      MEDIAWIKI_DB_ROOT_PASSWORD: ci-root-pass
      SERVICE_URL_MEDIAWIKI_8080: http://localhost
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: mediawiki
          file: mediawiki/Dockerfile
          push: false
          load: true
          tags: ghcr.io/sudo-ivan/hardened-stacks/mediawiki:ci
          cache-from: type=gha,scope=mediawiki
          cache-to: type=gha,mode=max,scope=mediawiki

      - name: Smoke health endpoint
        working-directory: mediawiki
        env:
          MEDIAWIKI_IMAGE: ghcr.io/sudo-ivan/hardened-stacks/mediawiki:ci
        run: |
          docker compose up -d --no-build
          trap 'docker compose down -v' EXIT
          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:8080/api.php?action=query&meta=siteinfo&format=json" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1

  copyparty-build:
    name: copyparty image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COPYPARTY_ADMIN_PASSWORD: ci-copyparty-pass
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: copyparty
          file: copyparty/Dockerfile
          push: false
          load: true
          tags: ghcr.io/sudo-ivan/hardened-stacks/copyparty:ci
          cache-from: type=gha,scope=copyparty
          cache-to: type=gha,mode=max,scope=copyparty

      - name: Smoke health endpoint
        run: |
          cid=$(docker run -d -p 127.0.0.1:13923:3923 -e COPYPARTY_ADMIN_PASSWORD=ci-copyparty-pass ghcr.io/sudo-ivan/hardened-stacks/copyparty:ci)
          trap 'docker rm -f "$cid"' EXIT
          for i in $(seq 1 30); do
            if wget --spider -q "http://127.0.0.1:13923/?reset=/._"; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$cid"
          exit 1

  forgejo-build:
    name: forgejo image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORGEJO_DB_PASSWORD: ci-forgejo-db-pass
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: forgejo
          file: forgejo/Dockerfile
          push: false
          load: true
          tags: ghcr.io/sudo-ivan/hardened-stacks/forgejo:ci
          cache-from: type=gha,scope=forgejo
          cache-to: type=gha,mode=max,scope=forgejo

      - name: Smoke health endpoint
        working-directory: forgejo
        env:
          FORGEJO_IMAGE: ghcr.io/sudo-ivan/hardened-stacks/forgejo:ci
        run: |
          docker compose up -d
          trap 'docker compose down -v' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

  flathub-remote-build:
    name: flathub-remote image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: flathub-remote
          file: flathub-remote/Dockerfile
          push: false
          load: true
          tags: ghcr.io/sudo-ivan/hardened-stacks/flathub-remote:ci
          cache-from: type=gha,scope=flathub-remote
          cache-to: type=gha,mode=max,scope=flathub-remote

      - name: Smoke health endpoint
        run: |
          cid=$(docker run -d -p 127.0.0.1:18080:8080 \
            -e FLATHUB_INITIAL_SYNC=false \
            -e FLATHUB_SYNC_INTERVAL=0 \
            ghcr.io/sudo-ivan/hardened-stacks/flathub-remote:ci)
          trap 'docker rm -f "$cid"' EXIT
          for i in $(seq 1 30); do
            if wget --spider -q "http://127.0.0.1:18080/health"; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$cid"
          exit 1

  cgit-build:
    name: cgit image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: cgit
          file: cgit/Dockerfile
          push: false
          load: true
          tags: ghcr.io/sudo-ivan/hardened-stacks/cgit:ci
          cache-from: type=gha,scope=cgit
          cache-to: type=gha,mode=max,scope=cgit

      - name: Smoke health endpoint
        run: |
          docker volume create cgit-ci-repos
          docker volume create cgit-ci-cfg
          keydir=$(mktemp -d)
          ssh-keygen -t ed25519 -f "$keydir/id_ed25519" -N "" -q
          pub=$(cat "$keydir/id_ed25519.pub")
          cid=$(docker run -d -p 127.0.0.1:18081:8080 -p 127.0.0.1:12222:2222 \
            --read-only \
            --tmpfs /tmp:rw,size=64m,mode=1777 \
            --tmpfs /run:rw,size=16m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --user 10001:10001 \
            -v cgit-ci-repos:/repos \
            -v cgit-ci-cfg:/cfg \
            -e CGIT_PUBLIC_URL=http://127.0.0.1:18081 \
            -e CGIT_SSH_HOST=127.0.0.1 \
            -e CGIT_SITE_TITLE='ci cgit' \
            -e CGIT_SSH_AUTHORIZED_KEYS="$pub" \
            ghcr.io/sudo-ivan/hardened-stacks/cgit:ci)
          trap 'docker rm -f "$cid"; docker volume rm cgit-ci-repos cgit-ci-cfg; rm -rf "$keydir" /tmp/cgit-ci-clone /tmp/cgit-ci-ssh-clone' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18081/health" >/dev/null \
              && curl -sS "http://127.0.0.1:18081/" | grep -q 'ci cgit'; then
              docker exec "$cid" entrypoint.sh init-repo demo "Demo"
              docker exec "$cid" sh -c '
                set -eu
                work=/tmp/demo-src
                rm -rf "$work"
                mkdir -p "$work"
                git -C "$work" init -q
                git -C "$work" config user.email ci@example.com
                git -C "$work" config user.name ci
                echo hello > "$work/README"
                git -C "$work" add README
                git -C "$work" commit -q -m init
                git -C "$work" remote add origin /repos/demo.git
                git -C "$work" push -q origin HEAD:refs/heads/master
              '
              rm -rf /tmp/cgit-ci-clone /tmp/cgit-ci-ssh-clone
              git clone -q http://127.0.0.1:18081/demo.git /tmp/cgit-ci-clone
              grep -qx hello /tmp/cgit-ci-clone/README
              GIT_SSH_COMMAND="ssh -i $keydir/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 12222" \
                git clone -q ssh://git@127.0.0.1:12222/demo.git /tmp/cgit-ci-ssh-clone
              grep -qx hello /tmp/cgit-ci-ssh-clone/README
              exit 0
            fi
            sleep 2
          done
          docker logs "$cid"
          exit 1

  bugpin-build:
    name: bugpin image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: bugpin
          file: bugpin/Dockerfile
          push: false
          load: true
          tags: ghcr.io/sudo-ivan/hardened-stacks/bugpin:ci
          cache-from: type=gha,scope=bugpin
          cache-to: type=gha,mode=max,scope=bugpin

      - name: Smoke health endpoint
        working-directory: bugpin
        env:
          BUGPIN_IMAGE: ghcr.io/sudo-ivan/hardened-stacks/bugpin:ci
        run: |
          docker compose up -d --no-build
          trap 'docker compose down -v' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7300/health | grep -q healthy; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

  ravenguard-build:
    name: ravenguard image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ravenguard
          file: ravenguard/Dockerfile
          push: false
          load: true
          tags: ghcr.io/sudo-ivan/hardened-stacks/ravenguard:ci
          cache-from: type=gha,scope=ravenguard
          cache-to: type=gha,mode=max,scope=ravenguard

      - name: Smoke health endpoint
        working-directory: ravenguard
        env:
          RAVENGUARD_IMAGE: ghcr.io/sudo-ivan/hardened-stacks/ravenguard:ci
          RG_CHALLENGE_SECRET: ci-rg-challenge-secret!!
          RG_ADMIN_BOOTSTRAP_PASSWORD: ci-rg-admin-pass
        run: |
          docker compose up -d --no-build
          trap 'docker compose down -v' EXIT
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            if [ "$code" = "200" ] || [ "$code" = "403" ] || [ "$code" = "429" ]; then
              admin=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9090/ || true)
              if [ "$admin" = "200" ] || [ "$admin" = "301" ] || [ "$admin" = "302" ] || [ "$admin" = "401" ]; then
                exit 0
              fi
            fi
            sleep 2
          done
          docker compose logs
          exit 1
