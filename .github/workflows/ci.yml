name: ci

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backup-cli:
    name: flarum-backup-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: flarum-backup-cli/go.mod
          cache: true
          cache-dependency-path: flarum-backup-cli/go.mod

      - name: Check
        working-directory: flarum-backup-cli
        run: make check

  docker-build:
    name: flarum image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FLARUM_FORUM_TITLE: ci
      FLARUM_ADMIN_EMAIL: ci@example.com
      SERVICE_URL_FLARUM_8080: http://localhost
      SERVICE_PASSWORD_FLARUMADMIN: ci-admin-pass
      SERVICE_PASSWORD_FLARUMDB: ci-db-pass
      SERVICE_PASSWORD_FLARUMROOT: ci-root-pass
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: flarum/Dockerfile
          push: false
          load: true
          tags: ghcr.io/sudo-ivan/hardened-stacks/flarum:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke backup CLI
        run: docker run --rm --entrypoint flarum-backup ghcr.io/sudo-ivan/hardened-stacks/flarum:ci version

  otterwiki-build:
    name: otterwiki image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: otterwiki
          file: otterwiki/Dockerfile
          push: false
          load: true
          tags: ghcr.io/sudo-ivan/hardened-stacks/otterwiki:ci
          cache-from: type=gha,scope=otterwiki
          cache-to: type=gha,mode=max,scope=otterwiki

      - name: Smoke health endpoint
        run: |
          cid=$(docker run -d -p 127.0.0.1:18080:8080 ghcr.io/sudo-ivan/hardened-stacks/otterwiki:ci)
          trap 'docker rm -f "$cid"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/-/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$cid"
          exit 1

  copyparty-build:
    name: copyparty image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COPYPARTY_ADMIN_PASSWORD: ci-copyparty-pass
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: copyparty
          file: copyparty/Dockerfile
          push: false
          load: true
          tags: ghcr.io/sudo-ivan/hardened-stacks/copyparty:ci
          cache-from: type=gha,scope=copyparty
          cache-to: type=gha,mode=max,scope=copyparty

      - name: Smoke health endpoint
        run: |
          cid=$(docker run -d -p 127.0.0.1:13923:3923 -e COPYPARTY_ADMIN_PASSWORD=ci-copyparty-pass ghcr.io/sudo-ivan/hardened-stacks/copyparty:ci)
          trap 'docker rm -f "$cid"' EXIT
          for i in $(seq 1 30); do
            if wget --spider -q "http://127.0.0.1:13923/?reset=/._"; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$cid"
          exit 1

  forgejo-build:
    name: forgejo image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORGEJO_DB_PASSWORD: ci-forgejo-db-pass
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: forgejo
          file: forgejo/Dockerfile
          push: false
          load: true
          tags: ghcr.io/sudo-ivan/hardened-stacks/forgejo:ci
          cache-from: type=gha,scope=forgejo
          cache-to: type=gha,mode=max,scope=forgejo

      - name: Smoke health endpoint
        working-directory: forgejo
        env:
          FORGEJO_IMAGE: ghcr.io/sudo-ivan/hardened-stacks/forgejo:ci
        run: |
          docker compose up -d
          trap 'docker compose down -v' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
