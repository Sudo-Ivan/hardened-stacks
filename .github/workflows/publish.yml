name: publish

on:
  push:
    branches: [main, master]
    tags: ["flarum-v*", "mediawiki-v*", "copyparty-v*", "forgejo-v*", "flathub-remote-v*", "cgit-v*", "bugpin-v*", "bugsink-v*", "kaneo-v*", "ravenguard-v*", "v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: guard trusted ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Allow only this repository on non-PR events
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          echo "event=${EVENT_NAME} repo=${REPOSITORY} ref=${REF} actor=${ACTOR}"
          if [ "${REPOSITORY}" != "Sudo-Ivan/hardened-stacks" ]; then
            echo "Refusing publish outside Sudo-Ivan/hardened-stacks"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${EVENT_NAME}" in
            push|workflow_dispatch)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  publish-flarum:
    name: publish flarum
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      image_name: sudo-ivan/hardened-stacks/flarum
      context: .
      file: flarum/Dockerfile
      cache_scope: flarum
      pass_version_args: true
      description: Rootless Flarum with RavenGuard-ready Coolify stack

  publish-mediawiki:
    name: publish mediawiki
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    permissions:
