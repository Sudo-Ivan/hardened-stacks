name: publish

on:
  push:
    branches: [main, master]
    tags: ["flarum-v*", "mediawiki-v*", "copyparty-v*", "forgejo-v*", "flathub-remote-v*", "cgit-v*", "bugpin-v*", "v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: guard trusted ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Allow only this repository on non-PR events
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          echo "event=${EVENT_NAME} repo=${REPOSITORY} ref=${REF} actor=${ACTOR}"
          if [ "${REPOSITORY}" != "Sudo-Ivan/hardened-stacks" ]; then
            echo "Refusing publish outside Sudo-Ivan/hardened-stacks"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${EVENT_NAME}" in
            push|workflow_dispatch)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  publish-flarum:
    name: publish flarum
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: sudo-ivan/hardened-stacks/flarum
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: flarum/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=flarum
          cache-to: type=gha,mode=max,scope=flarum

