    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      image_name: sudo-ivan/hardened-stacks/mediawiki
      context: mediawiki
      file: mediawiki/Dockerfile
      cache_scope: mediawiki
      description: Rootless MediaWiki Coolify stack

  publish-copyparty:
